# Manual-only deploy of release/nested (base /TenTen/) to GitHub Pages. Publishing approved by Amit on 5 Nov 2026 (T29).
# Start it from Actions -> "Deploy to GitHub Pages" -> Run workflow, on main.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
      - run: cat release/release-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/nested

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
